<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@1.0.4/css/bulma.min.css">
    <link rel="stylesheet" href="../css/style.css">
    <title>pedidos</title>
</head>
<body>
    

    <hr>
    <div class="container">
        <h1 class="title is-1">Modulo de pedidos</h1>
        <hr>

        <label for="">Producto</label>
        <input class="input is-link" type="text" id="producto" required placeholder="Ingrese el nombre del producto">

        <br>

        <label for="">Direccion</label>
        <input class="input is-link" type="text" id="direccion" required placeholder="Ingrese su Direccion">

        <br>

      

        <label for="">Nombre del usuario </label>
        <input class="input is-link" type="text" id="nombre_usuario" required placeholder="numero del usuario">

        <br>

        <label for="">Cantidad</label>
        <input class="input is-link" type="number" id="cantidad" required placeholder="Cantidad">

        <br>


        <label for="">Metodo de pago </label>
        <input class="input is-link"  type="text" id="metodo_pago" required placeholder="Ingrese su metodo de pago">

        <br>



        <label for="">Telefono </label>
        <input class="input is-link" type="text" id="telefono" required placeholder="Ingrese su telefono">

        <br>
        <br>

        <a class="button is-link is-outlined" type="button" href="../index.html"> volver al inicio </a> 
        <button class="button is-success is-outlined" type="button" id="btnGuardar"> guardar </button>

    
    </div>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="../js/pedidos.js"></script>
</body>
</html>
