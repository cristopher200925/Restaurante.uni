<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/usuarios.css">
    <title>usuarios</title>
</head>

<body>
    <h1>Modulo de usuarios</h1>
    <hr>
    <form action="">

        <label for="">Nombre</label>
        <input type="text" id="nombre_usuario" required placeholder="Ingrese el nombre">

        <br>

        <label for="">Apellido</label>
        <input type="text" id="apellido_usuario" required placeholder="Ingrese su apellido">

        <br>

        <label for="Tipo_de_Documento">tipo de documento </label>
        <input type="text" id="tipo_documento" required placeholder="Ingrese su tipo de documento">
        <br>

        <label for="">Numero de documento </label>
        <input type="number" id="numero_documento" required placeholder="numero_d del documento">

        <br>

        <label for="">Telefono</label>
        <input type="number" id="telefono" required placeholder="Ingrese su numero de telefono">

        <br>


        <label for="">Correo Electronico </label>
        <input type="email" id="correo_electronico" required placeholder="Ingrese el correo ">

        <br>

        <label for="Genero">Genero </label>
        <input type="text" id="genero" required placeholder="Ingrese su genero">

        <br>

        <label for="">Cargo </label>
        <input type="text" id="cargo" required placeholder="Ingrese su cargo">

       <br> 

        <label for="">Fecha de nacimiento </label>
        <input type="date" id="fecha_nacimiento" required placeholder="Ingrese su fecha de nacimiento">
        <br>

        <label for="">Contrasena  </label>
        <input type="password" id="contrasena" required placeholder="Ingrese su Contraseña">
        

         <a href="../index.html"> volver al inicio </a> 
         <button type ="button" id="btnGuardar"> guardar </button>  
         
    </form>
     <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="../js/usuarios.js"></script>
</body>

</html>
