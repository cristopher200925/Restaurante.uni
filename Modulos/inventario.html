<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/inventario.css">
    <title>inventario</title>
</head>
<body>
    <h1>Modulo de inventario</h1>
    <hr>
    <form action="">

         <label for = "">Categoria</label>
         <input type="text" id="categoria"  placeholder="Ingrese la categoria">

         <br>

         <label for = "">Codigo del producto:</label>
         <input type="number" id="codigo_producto"  placeholder="Ingrese el codigo del producto">

         <br>

         <label for = "">Nombre del producto: </label >
         <input type="text" id="nombre_producto"  placeholder="Ingrese el nombre del producto">

         <br>
   
         <label for = "">Descripcion del producto: </label>
         <input type="text" id="descripcion_producto"  placeholder="Ingrese descripcion del producto">

         <br> 

         <label for = "">Cantidad de productos: </label>
         <input type="number" id="cantidad_productos"  placeholder="Ingrese la cantidad de productos">

         <br>
        
        
         <label for = "">Precio unitario: </label>
         <input type="number" id="precio_unitario"  placeholder="Ingrese el precio unitario">

         <br>

         <label for = "">Provedor: </label>
         <input type="text" id="provedor"  placeholder="Ingrese el nombre del provedor">

         <br>
         
         <a href="../index.html"> volver al inicio </a> 
         <button type="button" id="btnGuardar">guardar</button>

    </form>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="../js/inventario.js"></script>
</body>
</html>
